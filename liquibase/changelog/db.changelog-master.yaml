databaseChangeLog:
  - changeSet:
      id: 1
      author: postgres
      changes:
        - createTable:
            tableName: events
            columns:
              - column: { name: id, type: int, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: varchar(200), constraints: { nullable: false } }
              - column: { name: description, type: text }
              - column: { name: place, type: varchar(200), constraints: { nullable: false } }
              - column: { name: event_type, type: int, constraints: { nullable: false } }
              - column: { name: start_time_utc, type: timestamp, constraints: { nullable: false } }
              - column: { name: end_time_utc, type: timestamp, constraints: { nullable: false } }
              - column: { name: ticket_count, type: int, constraints: { nullable: false } }
              - column: { name: price, type: int, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, defaultValueComputed: "CURRENT_TIMESTAMP" }
        - createTable:
            tableName: ticket_owners
            columns:
              - column: { name: id, type: int, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: surname, type: varchar(100), constraints: { nullable: false } }
              - column: { name: phone, type: varchar(20) }
              - column: { name: email, type: varchar(100), constraints: { nullable: false } }
        - createTable:
            tableName: tickets
            columns:
              - column: { name: id, type: int, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: event_id, type: int, constraints: { nullable: false, foreignKeyName: fk_tickets_event, references: events(id) } }
              - column: { name: ticket_number, type: varchar(50), constraints: { nullable: false, unique: true } }
              - column: { name: owner_id, type: int, constraints: { foreignKeyName: fk_tickets_owner, references: ticket_owners(id), deleteCascade: false } }
              - column: { name: purchase_date, type: timestamp, constraints: { nullable: false } }
              - column: { name: is_checked_in, type: boolean, defaultValueBoolean: false }
              - column: { name: checked_in_at, type: timestamp }
        - createIndex:
            tableName: events
            indexName: ix_events_start_time
            columns:
              - column: { name: start_time_utc }
        - createIndex:
            tableName: ticket_owners
            indexName: ix_ticket_owners_email
            columns:
              - column: { name: email }
        - createIndex:
            tableName: tickets
            indexName: ix_tickets_number
            unique: true
            columns:
              - column: { name: ticket_number }