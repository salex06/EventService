services:
  # Database
  mongodb:
    image: mongo:4.4-focal
    container_name: ms_lab_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db

  # Cache
  redis:
    image: redis:7.2-alpine
    container_name: ms_lab_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Metrics and visualization
  grafana:
    image: grafana/grafana:11.6.11-ubuntu
    container_name: ms_lab_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: ms_lab_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - ms_lab1
      - ms_lab2 

  # Main program
  # 1st instance
  ms_lab1:
    build:
      context: .
      dockerfile: MS_Lab/Dockerfile
    container_name: ms_lab_backend1
    ports:
       - "8080:8080"
    environment:
       - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped
  
  # 2nd instance
  ms_lab2:
    build:
      context: .
      dockerfile: MS_Lab/Dockerfile
    container_name: ms_lab_backend2
    ports:
       - "8081:8080"
    environment:
       - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  grafana_data: 