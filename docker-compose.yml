services:
  # Database
  mongodb:
    image: mongo:4.4-focal
    container_name: ms_lab_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb_data:/data/db
    networks:
      - ms_network

  # Cache
  redis:
    image: redis:7.2-alpine
    container_name: ms_lab_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ms_network

  # Metrics and visualization
  grafana:
    image: grafana/grafana:11.6.11-ubuntu
    container_name: ms_lab_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ms_network

  prometheus:
    image: prom/prometheus:latest
    container_name: ms_lab_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - ms_object_service
    networks:
      - ms_network

  # Main program
  ms_object_service:
    build:
      context: ./MS_Lab
      dockerfile: Dockerfile
    container_name: ms_object_service
    expose:
       - "8080"
    environment:
       - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped
    depends_on:
       - mongodb
       - kafka
       - kafka-ui
       - redis 
    networks:
      - ms_network
    

  ms_client_service:
    build:
      context: ./ClientService
      dockerfile: Dockerfile
    container_name: ms_client_service
    expose:
       - "8080"
    environment:
       - ASPNETCORE_ENVIRONMENT=Development
    restart: unless-stopped
    depends_on:
       - mongodb
       - kafka
       - kafka-ui
       - redis 
    networks:
      - ms_network
  

  # Kafka
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    container_name: ms_lab_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_FORMAT_LOG_DIRS: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "nc", "-z", "kafka", "9092"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - ms_network
  
  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ms_lab_kafka-ui
    ports:
      - "8079:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      #KAFKA_CLUSTERS_0_JMXPORT: 9997
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ms_network

  auth_service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: auth_service
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=SuperSecretKeyForJwtTokenGeneration123
    networks:
      - ms_network

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: api_gateway
    ports:
      - "5001:8080"
    volumes:
      - ./ApiGateway/ocelot.json:/app/ocelot.json
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=SuperSecretKeyForJwtTokenGeneration123
    depends_on:
      - ms_object_service
      - ms_client_service
      - auth_service
    networks:
      - ms_network

networks:
  ms_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  grafana_data: 
  kafka_data:  
